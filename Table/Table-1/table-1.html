<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Education - Home</title>
    <link rel="stylesheet" href="../../Common/style.css">
    <link rel="stylesheet" href="../Table-1/table-1.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
</head>

<body>

    <section id="learn-more" class="table-1">
        <table id="education-data" class="display">
            <thead>
                <tr>
                    <th rowspan="2" width="90px">Country</th>
                    <th rowspan="2" width="90px" hight="50px"> Country <br> Flag</th>
                    <th colspan="2">2015 Data</th>
                    <th colspan="2">2020 Data</th>
                    <th colspan="2">Absolute Change</th>
                    <th colspan="2">Relative Change (%)</th>
                    <th rowspan="2">Students <br> To <br>Teacher Ratio</th>
                </tr>
                <tr>
                    <th>Literacy Rate (%)</th>
                    <th>Enrollment Rate (%)</th>
                    <th>Literacy Rate (%)</th>
                    <th>Enrollment Rate (%)</th>
                    <th>Literacy</th>
                    <th>Enrollment</th>
                    <th>Literacy</th>
                    <th>Enrollment</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>

        <script>
            $(document).ready(function () {
                $('#education-data').DataTable({
                    "ajax": "table1data.json",
                    "columns": [
                        { "data": "country" },
                        {
                            "data": "flag",
                            "render": function (data, type, row) {
                                return '<img src="' + data + '" alt="' + row.country + ' Flag" style="height:50px;">';
                            }
                        },
                        { "data": "literacy2015" },
                        { "data": "enrollment2015" },
                        { "data": "literacy2020" },
                        { "data": "enrollment2020" },
                        {
                            "data": "absoluteChangeLiteracy",
                            "render": function (data, type, row) {
                                return data >= 0 ? '+' + data : data;
                            }
                        },
                        {
                            "data": "absoluteChangeEnrollment",
                            "render": function (data, type, row) {
                                return data >= 0 ? '+' + data : data;
                            }
                        },
                        {
                            "data": "relativeChangeLiteracy",
                            "render": function (data, type, row) {
                                return data >= 0 ? '+' + data : data;
                            }
                        },
                        {
                            "data": "relativeChangeEnrollment",
                            "render": function (data, type, row) {
                                return data >= 0 ? '+' + data : data;
                            }
                        },
                        { "data": "studentTeacherRatio" }
                    ],
                    "pageLength": 5,
                    "order": [[0, "asc"]],
                    "responsive": true,
                    "autoWidth": false,

                    "language": {
                        "paginate": {
                            "previous": "<",
                            "next": ">"
                        },
                        "lengthMenu": "_MENU_"
                    },
                    "dom": '<"dt-header"f>rt<"dt-footer"<"footer-left"l><"footer-center"i><"footer-right"p>>',
                    "initComplete": function (settings, json) {
                        // Ensure the iframe resizes after content is fully rendered
                        if (window.frameElement) {
                            window.parent.resizeIframe(window.frameElement);
                        }
                    }

                });
                table.on('draw.dt', function () {
                    if (window.frameElement) {
                        window.parent.resizeIframe(window.frameElement);
                    }
                });
                $('.dt-header').prepend('<h2 style="margin-bottom:16px;">Quality Education Data</h2>');
            });
        </script>
    </section>
</body>

</html>
